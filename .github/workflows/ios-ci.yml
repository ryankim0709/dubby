name: iOS CI

on:
  pull_request:
    paths:
      - 'Dubbing/**'
      - 'DubbingTests/**'
      - 'DubbingUITests/**'
      - 'Dubbing.xcodeproj/**'
      - 'scripts/qa/**'
      - '.github/workflows/ios-ci.yml'
  push:
    branches: ['**']
    paths:
      - 'Dubbing/**'
      - 'DubbingTests/**'
      - 'DubbingUITests/**'
      - 'Dubbing.xcodeproj/**'
      - 'scripts/qa/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and unit tests (iOS 26 simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode with the iOS 26 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Build and test
        run: scripts/qa/ios-build-test.sh all

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f build/qa/summary.txt ]; then
            { echo '### iOS build and test'; echo '```'; cat build/qa/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The script wrote no summary; see the step log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-ci-results
          path: |
            build/qa/summary.txt
            build/qa/*.log
            build/qa/*.xcresult
            build/qa/Dubbing.app.zip
          if-no-files-found: warn
          retention-days: 14
