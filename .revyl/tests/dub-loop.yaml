test:
  metadata:
    name: "DubIt dub loop: clean install to share"
    platform: ios
    tags:
      - smoke
      - dub-loop
  build:
    name: "dubby"
  device:
    model: "iPhone 17 Pro"
    os_version: "iOS 26.5"
    orientation: portrait
  blocks:
    - type: validation
      step_description: "The element with accessibility identifier \"discoverScreen\" is visible and no system permission prompt is showing"
    - type: instructions
      step_description: "Tap the tab button with accessibility identifier \"tab-myDubs\""
    - type: validation
      step_description: "The element with accessibility identifier \"myDubsEmpty\" is visible"
    - type: instructions
      step_description: "Tap the tab button with accessibility identifier \"tab-discover\""
    - type: validation
      step_description: "The element with accessibility identifier \"sceneCard-demo\" is visible"
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"dubScene-demo\""
    - type: instructions
      step_description: "If the button with accessibility identifier \"transcribeScene\" is visible, tap it and wait for the element with accessibility identifier \"scriptScreen\""
    - type: validation
      step_description: "The element with accessibility identifier \"scriptScreen\" is visible and lists at least one line"
    - type: instructions
      step_description: "Tap the first button whose accessibility identifier starts with \"characterCard-\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"startDubbing\""
    - type: validation
      step_description: "The element with accessibility identifier \"studioScreen\" is visible, \"studioStatus\" has the value \"idle\", and \"fixtureInputBadge\" is visible"
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"listenToOriginal\""
    - type: validation
      step_description: "The element \"studioStatus\" has the value \"playingOriginal\", then returns to \"idle\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"recordLine\""
    - type: instructions
      step_description: "If a system dialog asks for microphone access, tap its \"Allow\" button"
    - type: validation
      step_description: "The element with accessibility identifier \"recordingIndicator\" is visible"
    - type: manual
      step_type: wait
      step_description: "15"
    - type: validation
      step_description: "The element \"recordingIndicator\" is no longer visible and \"studioStatus\" has the value \"idle\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"playTake\" and wait until \"studioStatus\" is \"idle\" again"
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"retryTake\", wait for \"recordingIndicator\", then wait until it disappears"
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"keepTake\""
    - type: validation
      step_description: "An element with an accessibility identifier starting with \"lineKept-\" is visible and \"studioProgress\" has a value starting with \"1 of\""
    - type: instructions
      step_description: "Repeat for each remaining line: tap \"studioNext\", tap \"listenToOriginal\" and wait for idle, tap \"recordLine\", wait for \"recordingIndicator\" to appear and disappear, tap \"keepTake\""
    - type: validation
      step_description: "The element \"studioProgress\" shows the same number kept as the total, for example \"3 of 3\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"finishDub\""
    - type: validation
      step_description: "The element \"exportScreen\" is visible and \"exportStatus\" never shows a finished result before it has the value \"finished\""
    - type: manual
      step_type: wait
      step_description: "30"
    - type: validation
      step_description: "The element \"exportStatus\" has the value \"finished\" and \"resultPlayer\" has the value \"ready\""
    - type: validation
      step_description: "The element \"savedStatus\" has the value \"saved\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"shareDub\""
    - type: validation
      step_description: "The system share sheet is visible"
    - type: instructions
      step_description: "Tap the share sheet button named \"Close\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"doneDub\""
    - type: instructions
      step_description: "Tap the tab button with accessibility identifier \"tab-myDubs\""
    - type: validation
      step_description: "The element \"myDubsCount\" has the value \"1\" and an element with an identifier starting with \"savedDub-\" is visible"
    - type: instructions
      step_description: "Close the app completely and open it again"
    - type: instructions
      step_description: "Tap the tab button with accessibility identifier \"tab-myDubs\""
    - type: validation
      step_description: "The element \"myDubsCount\" still has the value \"1\""
    - type: instructions
      step_description: "Tap the button whose accessibility identifier starts with \"savedDub-\""
    - type: validation
      step_description: "The element with accessibility identifier \"savedDubPlayer\" is visible"
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"savedDubShare\""
    - type: validation
      step_description: "The system share sheet is visible"
    - type: instructions
      step_description: "Tap the share sheet button named \"Close\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"savedDubDone\""
