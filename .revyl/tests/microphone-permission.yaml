test:
  metadata:
    name: "DubIt microphone denied then recovered in Settings"
    platform: ios
    tags:
      - smoke
      - permissions
  build:
    name: "dubby"
  device:
    model: "iPhone 17 Pro"
    os_version: "iOS 26.5"
    orientation: portrait
  blocks:
    - type: validation
      step_description: "The element with accessibility identifier \"discoverScreen\" is visible"
    - type: instructions
      step_description: "Tap \"dubScene-demo\", complete scene setup (tap \"transcribeScene\" if it is shown), tap the first \"characterCard-\" button, then tap \"startDubbing\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"recordLine\""
    - type: instructions
      step_description: "When the system microphone dialog appears, tap its \"Don't Allow\" button"
    - type: validation
      step_description: "The element \"microphonePermissionBanner\" has the value \"denied\", \"recordingIndicator\" is not visible, and \"studioProgress\" starts with \"0 of\""
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"openSettings\""
    - type: validation
      step_description: "The Settings app is showing the page for the app with a \"Microphone\" switch that is off"
    - type: instructions
      step_description: "Turn on the switch named \"Microphone\", then return to the app"
    - type: instructions
      step_description: "Wait until the button with accessibility identifier \"recordLine\" is enabled again, then tap it"
    - type: validation
      step_description: "The element \"recordingIndicator\" is visible"
    - type: manual
      step_type: wait
      step_description: "15"
    - type: instructions
      step_description: "Tap the button with accessibility identifier \"keepTake\""
    - type: validation
      step_description: "\"studioProgress\" starts with \"1 of\" and \"microphonePermissionBanner\" is not visible"
